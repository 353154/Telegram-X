name: Build Telegram X Latest APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Maximize Build Space & Add Swap
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 10

      - name: Checkout Code with Submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '25'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Configure Memory & Credentials in local.properties
        env:
          SECRET_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          SECRET_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: |
          API_ID="${SECRET_API_ID:-6}"
          API_HASH="${SECRET_API_HASH:-eb06d4abfb49dc3eeb1aeb98ae0f581e}"

          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "telegram.api_id=$API_ID" >> local.properties
          echo "telegram.api_hash=$API_HASH" >> local.properties

          # 针对 GitHub Actions 7G 内存环境重置 JVM 堆内存，配合 Swap 防止 OOM
          sed -i 's/-Xmx8G/-Xmx5G/g' gradle.properties || true
          echo "org.gradle.jvmargs=-Xmx5120m -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError" >> gradle.properties

      - name: Grant Execute Permissions
        run: |
          chmod +x gradlew
          if [ -f "scripts/setup.sh" ]; then
            chmod +x scripts/setup.sh
            ./scripts/setup.sh || true
          fi

      - name: Build arm64 Latest Debug APK
        # 核心关键：-Pabi=arm64 仅编译主流 64 位手机架构，避免编译全部架构导致爆内存
        run: ./gradlew assembleLatestDebug -Pabi=arm64 --stacktrace --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Telegram-X-arm64-Latest-Debug-APK
          path: app/build/outputs/apk/**/*.apk
          retention-days: 14
