name: Build Telegram X Universal APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code with Submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Prepare local.properties with Telegram Credentials
        env:
          SECRET_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          SECRET_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: |
          API_ID="${SECRET_API_ID:-6}"
          API_HASH="${SECRET_API_HASH:-eb06d4abfb49dc3eeb1aeb98ae0f581e}"

          cat <<EOF > local.properties
sdk.dir=$ANDROID_HOME
app.disable_signing=true
telegram.api_id=$API_ID
telegram.api_hash=$API_HASH
tgx.extension=none
EOF
          echo "Created local.properties successfully:"
          cat local.properties

      - name: Setup Scripts and Dependencies
        run: |
          chmod +x gradlew
          if [ -d "scripts" ]; then
            chmod +x scripts/*.sh
            export ANDROID_SDK_ROOT=$ANDROID_HOME
            ./scripts/setup.sh --default-sdk-root || true
          fi

      - name: Build Universal Debug APK
        run: ./gradlew assembleUniversalDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Telegram-X-Universal-Debug-APK
          path: app/build/outputs/apk/**/*.apk
          retention-days: 14
