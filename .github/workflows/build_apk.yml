name: Build Telegram X Universal APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code with Submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Android SDK & NDK
        uses: android-actions/setup-android@v3

      - name: Prepare local.properties with Hardcoded Telegram Credentials
        env:
          SECRET_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          SECRET_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: |
          # 优先使用 Secrets，没有则自动使用内置硬编码凭据
          API_ID="${SECRET_API_ID:-6}"
          API_HASH="${SECRET_API_HASH:-eb06d4abfb49dc3eeb1aeb98ae0f581e}"

          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "telegram.api_id=$API_ID" >> local.properties
          echo "telegram.api_hash=$API_HASH" >> local.properties
          echo "Created local.properties with API_ID=$API_ID successfully."

      - name: Grant Execute Permission for Gradle & Setup Scripts
        run: |
          chmod +x gradlew
          if [ -f "scripts/setup.sh" ]; then
            chmod +x scripts/setup.sh
            ./scripts/setup.sh || true
          fi

      - name: Build Universal Debug APK
        run: ./gradlew assembleUniversalDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Telegram-X-Universal-Debug-APK
          path: app/build/outputs/apk/universal/debug/*.apk
          retention-days: 14
